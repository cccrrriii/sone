name: TV build

# Builds an installable SONE (AppImage + .deb) with TV mode and publishes it
# as the "tv-build" pre-release, replacing the previous one, so the latest
# build is always at the same download page.
on:
  push:
    branches:
      - master
      - claude/ecstatic-ritchie-yiqsb8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-build
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage and .deb
    # 22.04 keeps the AppImage runnable on older distros (glibc 2.35).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # The runner image preinstalls libunwind-14-dev, which blocks
          # libgstreamer1.0-dev's libunwind-dev dependency unless it is
          # requested explicitly (apt then swaps the two).
          sudo apt-get install --no-install-recommends -y \
            libunwind-dev \
            build-essential \
            pkg-config \
            file \
            patchelf \
            libfuse2 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            libsecret-1-dev \
            libasound2-dev \
            xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: tv-build

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --bundles appimage,deb

      - name: Publish the tv-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No build output found"
            exit 1
          fi
          gh release delete tv-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create tv-build "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SONE with TV mode (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. The .AppImage runs on any Linux distro: make it executable and double-click it. The .deb is for Ubuntu, Linux Mint and Debian. In SONE, open the user menu and choose **TV mode**, or start it with \`--tv\`."
